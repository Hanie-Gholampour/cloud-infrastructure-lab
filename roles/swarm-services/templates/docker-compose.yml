services:
  db:
    # TODO[VCC-012]: Configure docker compose for postgres
    image: postgres:16
    environment:
      POSTGRES_USER: {{ db_user }}
      POSTGRES_PASSWORD: {{ db_password }}
      POSTGRES_DB: {{ db_name }}
    volumes:
      - "{{ data_dir }}/pgdata:/var/lib/postgresql/data"
      - "{{ data_dir }}/configs/pgsql:/docker-entrypoint-initdb.d:ro"
    deploy:
      replicas: 1
      restart_policy:
        condition: any
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U {{ db_user }} -d {{ db_name }}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      net:
        aliases:
          - postgres

  forgejo:
    # TODO[VCC-013]: Configure docker compose for forgejo
    image: "{{ registry_address }}/forgejo"
    hostname: forgejo
    depends_on:
      - db
      - redis
      - authelia
    healthcheck:
      # Use /api/healthz endpoint instead of / to avoid "connection reset by peer" errors
      # The home page renders full HTML which conflicts with wget --spider HEAD requests
      test: ["CMD", "wget", "--no-verbose", "--spider", "http://localhost:{{ forgejo_port }}/api/healthz"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    deploy:
      replicas: 2
      restart_policy:
        condition: any
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.forgejo.rule=Host(`git.{{ domain_name }}`)"
        - "traefik.http.routers.forgejo.entrypoints=websecure"
        - "traefik.http.routers.forgejo.tls=true"
        - "traefik.http.services.forgejo.loadbalancer.server.port={{ forgejo_port }}"
    environment:
      FORGEJO_DB_HOST: postgres
      FORGEJO_DB_PORT: "5432"
      FORGEJO_DB_NAME: {{ db_name }}
      FORGEJO_DB_USER: {{ db_user }}
      FORGEJO_DB_PASS: {{ db_password }}
      FORGEJO_ADMIN_USER: {{ forgejo_admin_username }}
      FORGEJO_ADMIN_PASS: {{ forgejo_admin_password }}
      FORGEJO_ADMIN_EMAIL: {{ forgejo_admin_email }}
      FORGEJO_AUTH_URL: {{ authelia_url }}
      DOMAIN_NAME: {{ domain_name }}
      FORGEJO_OAUTH_SECRET: {{ forgejo_oidc_client_secret }}
      GITEA_CUSTOM: /data/gitea
      FORGEJO_CUSTOM: /data/gitea
      FORGEJO_WORK_DIR: /data/gitea
    volumes:
      - "{{ data_dir }}/forgejo:/data"
      - "{{ data_dir }}/configs/forgejo/forgejo.ini:/conf/app.ini:ro"
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
      - "{{ data_dir }}/certs/wildcard.crt:/usr/local/share/ca-certificates/wildcard.crt:ro"
    extra_hosts:
      - "auth.{{ domain_name }}:{{ keepalive_virtual_ip }}"
      - "git.{{ domain_name }}:{{ keepalive_virtual_ip }}"
      - "mon.{{ domain_name }}:{{ keepalive_virtual_ip }}"
    networks:
      net:

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    deploy:
      replicas: 1
      restart_policy:
        condition: any
    volumes:
      - "{{ data_dir }}/redis:/data"
    networks:
      - net

  authelia:
    # TODO[VCC-014]: Configure docker compose for authelia
    image: "{{ registry_address }}/authelia"
    hostname: authelia
    depends_on:
      - db
      - redis
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--spider", "http://localhost:{{ authelia_port }}/api/health"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s
    secrets:
      - jwks_key
    environment:
      # Note: address is set in config file as tcp://postgres:5432
      # Only pass credentials via env vars (not host/port which are deprecated)
      AUTHELIA_STORAGE_POSTGRES_DATABASE: {{ authelia_db }}
      AUTHELIA_STORAGE_POSTGRES_USERNAME: {{ authelia_db_user }}
      AUTHELIA_STORAGE_POSTGRES_PASSWORD: {{ authelia_db_password }}
    deploy:
      replicas: 2
      restart_policy:
        condition: any
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.authelia.rule=Host(`auth.{{ domain_name }}`)"
        - "traefik.http.routers.authelia.entrypoints=websecure"
        - "traefik.http.routers.authelia.tls=true"
        - "traefik.http.services.authelia.loadbalancer.server.port={{ authelia_port }}"
    volumes:
      - "{{ data_dir }}/configs/authelia:/config:ro"
      - "{{ data_dir }}/certs/wildcard.crt:/usr/local/share/ca-certificates/wildcard.crt:ro"
    extra_hosts:
      - "auth.{{ domain_name }}:{{ keepalive_virtual_ip }}"
      - "git.{{ domain_name }}:{{ keepalive_virtual_ip }}"
      - "mon.{{ domain_name }}:{{ keepalive_virtual_ip }}"
    networks:
      net:
        aliases:
          - auth.{{ domain_name }}

networks:
  net:

secrets:
  jwks_key:
    file: "{{ data_dir }}/jwks/jwks.key"